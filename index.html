<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Our Cosmic Universe ✨</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #030006;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none; -webkit-user-select: none;
    }

    #webgl-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    }

    /* ТОЛЬКО ТУМАННОСТЬ И НАСТОЯЩИЙ САМЫЙ ЗАДНИЙ ПЛАН (ПОЗАДИ ВСЕГО) */
    .bg-nebula-glow {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
      background: 
        radial-gradient(circle at 15% 25%, rgba(140, 40, 160, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(60, 20, 130, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(210, 50, 150, 0.15) 0%, transparent 60%);
      filter: blur(50px);
    }

    .deep-space-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .deep-star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: deepTwinkle var(--duration) ease-in-out infinite alternate;
      opacity: var(--base-opacity);
    }
    @keyframes deepTwinkle {
      0% { transform: scale(0.7); opacity: calc(var(--base-opacity) * 0.3); }
      100% { transform: scale(1.3); opacity: 0.9; box-shadow: 0 0 6px #f472b6; }
    }

    /* 1. СТАРТОВЫЙ ЭКРАН */
    .overlay-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 20; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, rgba(30, 10, 45, 0.5) 0%, rgba(5, 0, 10, 0.92) 100%);
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    .overlay-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .start-card {
      background: rgba(18, 10, 28, 0.7);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(244, 114, 182, 0.3);
      border-radius: 32px; padding: 40px 30px; text-align: center;
      max-width: 380px; width: 88%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(236, 72, 153, 0.3);
      animation: cardPulse 3s ease-in-out infinite alternate;
    }
    @keyframes cardPulse {
      0% { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(236, 72, 153, 0.2); }
      100% { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 50px rgba(236, 72, 153, 0.5); }
    }

    .start-card .icon-header {
      font-size: 3rem; margin-bottom: 12px;
      filter: drop-shadow(0 0 10px rgba(244, 114, 182, 0.6));
    }
    .start-card h1 {
      color: #fff; font-size: 1.6rem; font-weight: 700; margin-bottom: 8px;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #f472b6, #c084fc, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .start-card p {
      color: #e2e8f0; font-size: 0.85rem; margin-bottom: 30px;
      letter-spacing: 1px; text-transform: uppercase; opacity: 0.8;
    }

    .enter-btn {
      background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
      border: none; color: white; padding: 15px 32px; font-size: 0.85rem;
      font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      border-radius: 30px; cursor: pointer;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.5);
      transition: all 0.3s ease; outline: none;
    }
    .enter-btn:hover { transform: scale(1.05); box-shadow: 0 0 35px rgba(236, 72, 153, 0.8); }

    /* 2. КАРТОЧКА С ИСТОРИЕЙ */
    .popup-card-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 15; display: flex; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0; transition: opacity 0.4s ease;
    }
    .popup-card-container.active { pointer-events: auto; opacity: 1; }

    .popup-card {
      background: rgba(15, 8, 25, 0.82);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(244, 114, 182, 0.35);
      border-radius: 28px; padding: 25px; text-align: center;
      max-width: 350px; width: 85%;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(236, 72, 153, 0.3);
      transform: translateY(20px); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .popup-card-container.active .popup-card { transform: translateY(0); }

    .popup-card .img-box {
      width: 100%; height: 140px; border-radius: 18px; margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center;
      font-size: 3.8rem; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 20px rgba(236, 72, 153, 0.2);
    }
    .popup-card h2 {
      color: #f472b6; font-size: 1.3rem; font-weight: 700;
      letter-spacing: 1px; margin-bottom: 8px; display: none;
    }
    .popup-card p {
      color: #f1f5f9; font-size: 0.9rem; line-height: 1.55;
      margin-bottom: 22px; opacity: 0.95; white-space: pre-line;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(244, 114, 182, 0.4);
      color: #f472b6; padding: 10px 28px; border-radius: 20px; font-weight: 700;
      font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s ease;
    }
    .back-btn:hover { background: rgba(236, 72, 153, 0.25); transform: scale(1.05); }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="bg-nebula-glow"></div>
  <div class="deep-space-bg" id="deepSpace"></div>
  <div id="webgl-container"></div>

  <div class="overlay-screen" id="startScreen">
    <div class="start-card">
      <div class="icon-header">🛸✨</div>
      <h1>Our Universe</h1>
      <p>SPACE</p>
      <button class="enter-btn" onclick="startUniverse()">ENTER THE UNIVERSE</button>
    </div>
  </div>

  <div class="popup-card-container" id="popupCard">
    <div class="popup-card">
      <div class="img-box" id="popupEmoji">✨</div>
      <h2 id="popupTitle">TITLE</h2>
      <p id="popupText">Story details...</p>
      <button class="back-btn" onclick="closePopup()">ВОЛЬВЕР ↩</button>
    </div>
  </div>

  <script>
    // --- НАСТОЯЩИЙ САМЫЙ ЗАДНИЙ ПЛАН (БЕЗДНА ЗВЕЗД) ---
    const deepSpace = document.getElementById('deepSpace');
    for(let i = 0; i < 110; i++) {
      const star = document.createElement('div');
      star.className = 'deep-star';
      const size = Math.random() * 2 + 0.8;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.setProperty('--duration', (3 + Math.random() * 5) + 's');
      star.style.setProperty('--base-opacity', Math.random() * 0.5 + 0.15);
      deepSpace.appendChild(star);
    }

    // --- THREE.JS СЦЕНА ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030006, 0.0015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 90);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 140;
    controls.minDistance = 10;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.7;

    const ambientLight = new THREE.AmbientLight(0xffb7d5, 1.2);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xc084fc, 4, 100);
    pointLight.position.set(0, 0, 0);
    scene.add(pointLight);

    // --- ГЕНЕРАТОР СВЕТЯЩЕЙСЯ ТЕКСТУРЫ ---
    function createGlowParticle() {
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.2, 'rgba(216, 180, 254, 0.9)');
      grad.addColorStop(0.5, 'rgba(168, 85, 247, 0.4)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }
    const particleTex = createGlowParticle();

    // --- ЦЕНТРАЛЬНОЕ СВЕТЯЩЕЕСЯ ЯДРО ---
    const coreCount = 2500;
    const coreGeo = new THREE.BufferGeometry();
    const corePos = new Float32Array(coreCount * 3);

    for (let i = 0; i < coreCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = Math.cbrt(Math.random()) * 8.5;

      corePos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      corePos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      corePos[i * 3 + 2] = r * Math.cos(phi);
    }
    coreGeo.setAttribute('position', new THREE.BufferAttribute(corePos, 3));

    const coreMat = new THREE.PointsMaterial({
      size: 1.6, map: particleTex, color: 0xe9d5ff,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });
    const coreMesh = new THREE.Points(coreGeo, coreMat);
    scene.add(coreMesh);

    // --- РОЗОВО-ФИОЛЕТОВАЯ ГАЛАКТИКА ---
    const gCount = 8500;
    const gGeo = new THREE.BufferGeometry();
    const gPos = new Float32Array(gCount * 3);
    const gColors = new Float32Array(gCount * 3);

    const color1 = new THREE.Color(0xd8b4fe);
    const color2 = new THREE.Color(0x818cf8);

    for(let i=0; i<gCount; i++) {
      const r = Math.random() * 75 + 5;
      const spinAngle = r * 0.75;
      const branchAngle = ((i % 3) / 3) * Math.PI * 2;

      const randomX = (Math.random() - 0.5) * (70 / (r + 5));
      const randomY = (Math.random() - 0.5) * 6;
      const randomZ = (Math.random() - 0.5) * (70 / (r + 5));

      gPos[i*3] = Math.cos(branchAngle + spinAngle) * r + randomX;
      gPos[i*3+1] = randomY;
      gPos[i*3+2] = Math.sin(branchAngle + spinAngle) * r + randomZ;

      const mixedColor = color1.clone().lerp(color2, r / 75);
      gColors[i*3] = mixedColor.r;
      gColors[i*3+1] = mixedColor.g;
      gColors[i*3+2] = mixedColor.b;
    }
    gGeo.setAttribute('position', new THREE.BufferAttribute(gPos, 3));
    gGeo.setAttribute('color', new THREE.BufferAttribute(gColors, 3));

    const gMat = new THREE.PointsMaterial({
      size: 1.5, map: particleTex, vertexColors: true,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });
    const galaxyMesh = new THREE.Points(gGeo, gMat);
    scene.add(galaxyMesh);

    // --- ЭЛЕМЕНТЫ ОРБИТЫ ---
    function createTextSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.font = 'Bold 38px -apple-system, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ec4899'; ctx.shadowBlur = 12;
      ctx.fillText(text, 256, 70);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(18, 4.5, 1);
      return sprite;
    }

    const interactiveObjects = [];

    const orbitItems = [
      {
        text: "MOPED STORIES 🛵",
        emoji: "🛵",
        title: "Побег от собак",
        desc: "Тот день когда уезжали от собак)\nя целый, друг 200",
        radius: 34, angle: 0
      },
      {
        text: "WORLD CUP 2026 ⚽",
        emoji: "🏆",
        title: "Чемпионат Мира",
        desc: "88-я минута, счёт 0:0, пацаны на хате, серия пенальти за Аргентину и уход Месси.",
        radius: 46, angle: 1.25
      },
      {
        text: "ANARCHY CHAT 💥",
        emoji: "💥",
        title: "Лагерь 2026",
        desc: "Там начнется анархия))",
        radius: 58, angle: 2.5
      },
      {
        text: "CAMPFIRE NIGHTS 🔥",
        emoji: "🔥",
        title: "Разговоры у костра",
        desc: "Вечера, костёр и бесконечные темы для обсуждения до самой ночи.",
        radius: 40, angle: 3.75
      },
      {
        text: "NIGHT VIBE 🌙",
        emoji: "🌙",
        title: "",
        desc: "— Ты уже спишь?\n— Я всю ночь кумарюсь)\n— Напиши когда Освободишься\n— Я вот все уже",
        radius: 52, angle: 5.0
      }
    ];

    orbitItems.forEach((item) => {
      const sprite = createTextSprite(item.text);
      const x = Math.cos(item.angle) * item.radius;
      const z = Math.sin(item.angle) * item.radius;
      sprite.position.set(x, (Math.random() - 0.5) * 6, z);
      sprite.userData = item;
      scene.add(sprite);
      interactiveObjects.push(sprite);
    });

    // --- КЛИК ПО 3D ЭЛЕМЕНТАМ ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      if (!document.getElementById('startScreen').classList.contains('hidden')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);

      if (intersects.length > 0) {
        const data = intersects[0].object.userData;
        openPopup(data);
      }
    });

    function openPopup(data) {
      document.getElementById('popupEmoji').innerText = data.emoji;
      const titleEl = document.getElementById('popupTitle');
      if (data.title) {
        titleEl.innerText = data.title;
        titleEl.style.display = 'block';
      } else {
        titleEl.innerText = '';
        titleEl.style.display = 'none';
      }
      document.getElementById('popupText').innerText = data.desc;
      document.getElementById('popupCard').classList.add('active');
      controls.autoRotate = false;
    }

    function closePopup() {
      document.getElementById('popupCard').classList.remove('active');
      controls.autoRotate = true;
    }

    // --- АНИМАЦИЯ ВХОДА В ВСЕЛЕННУЮ ---
    function startUniverse() {
      document.getElementById('startScreen').classList.add('hidden');

      let duration = 110;
      let frame = 0;
      const startZ = 190;
      const targetZ = 85;

      camera.position.z = startZ;

      function flyIn() {
        frame++;
        camera.position.z = startZ - (startZ - targetZ) * (frame / duration);
        if (frame < duration) {
          requestAnimationFrame(flyIn);
        }
      }
      flyIn();
    }

    // --- АНИМАЦИОННЫЙ ЦИКЛ ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      coreMesh.rotation.y = time * 0.15;
      const coreScale = 1 + Math.sin(time * 2) * 0.04;
      coreMesh.scale.set(coreScale, coreScale, coreScale);

      galaxyMesh.rotation.y = time * 0.05;

      interactiveObjects.forEach((obj) => {
        obj.userData.angle += 0.0028;
        obj.position.x = Math.cos(obj.userData.angle) * obj.userData.radius;
        obj.position.z = Math.sin(obj.userData.angle) * obj.userData.radius;
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
